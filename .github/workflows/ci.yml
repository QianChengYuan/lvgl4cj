# ============================================================================
# CI —— 平台矩阵（设计文档 §10.4）
#
# ============================================================================
# ★★ 先说清楚这份配置**能**与**不能**验证什么（不要把矩阵当成等价验证）
# ============================================================================
#
# 【矩阵的真实能力】
#   · native-ubuntu-x64      : 全量 —— C 侧构建/单测/ASan + 仓颉侧 cjpm build/test、
#                              cjlint 零告警、cjfmt 零 diff
#   · native-ubuntu-arm64    : C 侧原生编译与 ctest（真跑，非模拟）
#   · native-macos-arm64     : C 侧原生编译与 ctest（真跑）
#   · cross-aarch64-check    : x86 上交叉编译 aarch64（只编译、不运行）
#
# 【关键限制：仓颉 SDK 无法在本仓库内自动获取】
#   矩阵里的**仓颉侧步骤只在 SDK 可用时执行**。SDK 需要由使用方提供。
#   这不是「静默跳过」：
#     · 未启用时，相关 job 在矩阵里显示为 **skipped**（不是 passed）；
#     · 启用后必须真的跑通 —— 脚本里的每条检查都是硬失败（set -e + 非零退出）。
#   为什么不做「下载一个公开包兜底」：那会把「CI 通过」建立在一个
#   与本地开发所用不确定是否同版本的 SDK 上，比直接显示 skipped 更危险。
#
# ★★ 首次启用前，需在本仓库配置两项（Settings → Secrets and variables → Actions）：
#     Variables : ENABLE_CANGJIE_JOB = true      ← 开关（可公开，仅表示"启不启用"）
#     Secrets   : CANGJIE_SDK_URL   = <下载地址>  ← 地址本体
#
#   **为什么拆成两个**：下载地址通常带签名参数（如 objectKey），属临时凭据，
#   `vars` 会明文出现在日志里，所以地址必须走 `secrets`；
#   而 GitHub 不允许 `secrets` 出现在 job 级 `if:` 条件里（那是配置期的判断），
#   因此启用与否由 `vars` 里的布尔开关决定。这是一个必须拆开的组合，
#   不是冗余设计。
#
#   **地址有时效**：签名过期后 CI 会在下载步骤明确报错（并提示该配置哪个 Secret），
#   届时只需更新 Secret —— 不必改本文件，也不必改代码。
#
# 【arm64 / macOS 上的仓颉侧为什么不跑】
#   macOS 与 linux-arm64 的仓颉 SDK 同样需要外部提供；且即便提供，
#   LVGL 的 SDL2 后端在 macOS 上的构建方式不同（需 SDL2.framework 或 brew 的 SDL2）。
#   因此这两个平台**只验证 C 层**（那正是本层手工内存管理所在，也是移植风险最集中的地方），
#   并在 docs/benchmarks/ 的平台矩阵记录中如实标注覆盖范围。
# ============================================================================
# 【§11.3 的 24h soak：为什么不在这个文件里，以及应该在哪跑】
# ============================================================================
# 官方限制（GitHub Docs — Actions limits）：
#   · GitHub **托管** runner：单作业最长 **6 小时**
#   · **自托管** runner    ：单作业最长 **5 天**
#   · 整个 workflow run    ：35 天
#
# 因此 24h 有两条可行路径，**都不是**"在托管 runner 上硬跑"：
#
#   ① 自托管 runner（若那台机器就是目标平台，这是最正确的选择）
#      在一台常开机器上注册 self-hosted runner，然后在该作业上写
#          runs-on: [self-hosted, linux, x64]
#          timeout-minutes: 1500
#      ★ 若这台机器**就是你要验收的硬件**，这条路径同时满足
#        §11.2/§11.3「量化指标必须在目标平台判定」的要求 ——
#        在别人家的 CI runner 上测出的 RSS 收敛，本来也不能作为目标平台的验收依据。
#
#   ② 任意常开机器上直接跑（不进 CI）
#          tmux new -s soak
#          bash scripts/soak.sh --seconds 86400
#      支持随时 Ctrl-C 中断出**部分报告**（已采样数据保留），
#      报告落在 docs/benchmarks/soak_24h.txt。
#      注意：它跑的是 bench_cj，需要能构建仓颉侧（SDK）。
#
# ★ 本文件里的 soak 作业只做**回归护栏**（默认 3 分钟，可手动加长到 5h 以内）。
#   它与 24h 验收的分工不可互相替代：
#     · 回归护栏：每次改动都跑，抓"状态不收敛"的**新回归**（短、频繁）
#     · 24h 验收：一次性、在目标平台、结果入库（长、稀疏）
#   短跑抓不到"每 8 小时才长一次的泄漏"；而 24h 不可能每次 push 都跑。
# ============================================================================

name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  # ★ 手动触发：用于按需跑较长的 soak（见下方 soak 作业）。
  #   为什么需要它 —— §11.3 要的 24h 在本文件里跑不了（原因写在 soak 作业上方），
  #   但"跑一个几小时的收敛验证"是可行的，且必须由人按需触发（不适合每次 push）。
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'soak 时长（分钟）。默认 3；要长跑可填 300（5h，GH 托管硬上限 6h）'
        required: false
        default: '3'

jobs:
  # ---------------------------------------------------------------------------
  # C 层构建 + 单测 + ASan（原生编译，真跑）
  # ---------------------------------------------------------------------------
  native:
    name: native / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # ★ 作业级上限：GitHub 默认是 **360 分钟**，一个挂起能把 runner 空耗 6 小时。
    #   本地全套（构建 + ctest + ASan）不到 5 分钟，45 分钟留了充足余量，
    #   却能把"永久挂着"变成"45 分钟后明确失败"。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x64
            os: ubuntu-24.04
            asan: true
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
            asan: true
          - name: macos-arm64
            os: macos-14
            # macOS 上 ASan 可用，但本仓库暂无该平台的基线数据，
            # 因此先只做构建 + 单测；ASan 待基线补齐后再纳入
            asan: false

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libsdl2-dev

      - name: 安装依赖（macOS）
        if: runner.os == 'macOS'
        run: brew install cmake sdl2

      # ---- LVGL 源码（约 200 MB，**不入库**，必须现拉）----------------------
      # ★ 这一步不能省：third_party/lvgl/ 被 .gitignore 排除（体积原因），
      #   克隆后它是不存在的，而 CMakeLists 会在配置阶段直接 FATAL_ERROR
      #   （"未找到 LVGL 源码……请先执行 bash scripts/fetch_lvgl.sh"）。
      #   也就是说：**没有这一步，整个 native 矩阵在第一次 push 就全红**。
      #   缓存能省掉每次 200 MB 的克隆；key 里带 runner.os 是因为
      #   不同 OS 上进 cache 的内容虽然同源，但分开更不容易互相污染。
      - name: 缓存 LVGL 源码
        uses: actions/cache@v4
        with:
          path: third_party/lvgl
          key: lvgl-v9.2.2-${{ runner.os }}

      - name: 拉取 LVGL（锁定版本 v9.2.2）
        # 默认仓库是 gitee 镜像（fetch_lvgl.sh 里可用 LVGLCJ_LVGL_REPO 覆盖），
        # 脚本自身按 tag 校验，重复执行是幂等的，因此缓存命中时它会直接跳过克隆。
        run: bash scripts/fetch_lvgl.sh

      - name: 配置（Debug + 单测）
        run: |
          cmake -S native -B build \
                -DCMAKE_BUILD_TYPE=Debug \
                -DLVGLCJ_BUILD_TESTS=ON

      - name: 构建
        run: cmake --build build -j

      - name: C 单测
        env:
          SDL_VIDEODRIVER: dummy
        run: ctest --test-dir build --output-on-failure

      # ---- ASan：本层手工内存管理的主要防线（§9.5）----
      - name: 构建（ASan）
        if: matrix.asan
        run: |
          cmake -S native -B build-asan \
                -DCMAKE_BUILD_TYPE=Debug \
                -DLVGLCJ_BUILD_TESTS=ON \
                -DLVGLCJ_BUILD_PROBES=ON \
                -DLVGLCJ_ASAN=ON
          cmake --build build-asan -j

      - name: ASan 工具自证（证明 ASan 真的在工作）
        if: matrix.asan
        run: |
          # 「零报告」只有在工具确实生效时才有意义。V4 探针人为泄漏 1234 字节，
          # 必须被报出且以非零码退出；否则说明 ASan 没被启用，门禁是假的。
          set +e
          ASAN_OPTIONS=detect_leaks=1 ./build-asan/bin/probe_v4_asan leak > v4.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "ASan 自证失败：人为泄漏未被报出"; cat v4.log; exit 1; fi
          grep -q "LeakSanitizer: detected memory leaks" v4.log || { cat v4.log; exit 1; }

      - name: ASan 单测（零报告）
        if: matrix.asan
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          fail=0
          # ★ 三点都是被"卡住"实际教会我们的，不是预防性写法：
          #   1. **先回显再做**。原来把输出收进变量，日志在整步结束前不显示任何东西 ——
          #      一旦某个用例挂起，看日志的人只知道"卡住了"，不知道卡在哪一个，
          #      只能干等作业超时。现在每个用例开始前先打一行。
          #   2. **每个用例有超时**。没有超时的话，一个挂起会拖着整个作业
          #      直到 GitHub 的默认上限（6 小时）。
          #   3. **报出用例耗时**。区分"慢"与"挂起"靠的是时间：
          #      本地 x64 全套 ASan 仅 ~29s，因此某个用例若接近超时上限，
          #      那不是慢，是真有问题。
          PER_TEST_TIMEOUT=180
          for t in $(ls build-asan/bin | grep '^test_'); do
            echo "→ ${t}"
            start=$SECONDS
            set +e
            # ★ `-k 10`：超时后先 SIGTERM，10 秒后升级为 SIGKILL。
            #   只用 timeout 的话，被卡住的进程若不响应 SIGTERM（阻塞在系统调用里、
            #   或信号被丢给不处理它的线程）会让 timeout 自己也一直等下去 ——
            #   那就等于没有超时。这一点是在 arm64 上实测到的：
            #   加了 180s 超时后该步骤仍然持续 12 分钟以上。
            out=$(ASAN_OPTIONS=detect_leaks=1 timeout -k 10 "${PER_TEST_TIMEOUT}" ./build-asan/bin/"$t" 2>&1)
            rc=$?
            set -e
            echo "  ${t} 用时 $(( SECONDS - start ))s（退出码 ${rc}）"

            if [ "$rc" = "124" ]; then
              echo "::error::${t} 超过 ${PER_TEST_TIMEOUT}s 未结束 —— 这是挂起，不是慢"
              printf '%s\n' "$out" | tail -30
              fail=1
              continue
            fi

            n=$(printf '%s' "$out" | grep -cE 'ERROR: (AddressSanitizer|LeakSanitizer)' || true)
            if [ "$n" != "0" ]; then
              echo "::error::${t} 有 $n 条 ASan 报告"
              printf '%s\n' "$out" | grep -A15 'ERROR: ' | head -30
              fail=1
            fi
            printf '%s' "$out" | grep -q '0 项失败' || { echo "::error::${t} 有断言失败"; fail=1; }
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # 交叉编译 aarch64（只编译，不运行）—— 可移植性回归
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # C 层长跑（收敛性回归护栏 + 手动长跑）
  # ---------------------------------------------------------------------------
  # ★★ 这个作业**不能**替代 §11.3 要求的 24h soak。原因写在下面，不要误读。★★
  #
  #   1. GitHub **托管** runner 的单作业硬上限是 **6 小时**（官方 Actions limits）。
  #      24h 在托管 runner 上**无法完成**。自托管 runner 的上限是 **5 天**，
  #      那才是真正跑 24h 的路径（见本文件末尾的说明）。
  #
  #   2. ★ 拆成 4 个 6h 作业**不是**替代方案。每个作业是一台全新 runner、
  #      一个全新进程，而 soak 要测的正是「**同一进程**长时间运行之后」的
  #      RSS 收敛与状态累积。重启恰好把被测对象重置了 ——
  #      若存在「每 8 小时增长一次」的泄漏，4×6h **永远看不到**。
  #      4 个 6h 的结论，不等于 1 个 24h 的结论。
  #
  #   所以本作业的定位是**回归护栏**：
  #     · 每次 push/PR 跑一个短的（默认 3 分钟）——便宜，且能抓到
  #       「状态不收敛」这类回归（t8 的两个缺陷都属于这一类）；
  #     · 手动触发（Actions → Run workflow）时可指定任意时长，
  #       受 6h 上限约束（建议 ≤300 分钟）。
  #
  #   它用**未插桩**（Release）的构建跑：要观察的是计数收敛，
  #   而 ASan 的插桩开销会同时改变内存与时间特征。
  #   ASan 覆盖已由 native 作业承担（那里用 8s 的 test_soak_asan）。
  soak:
    name: soak / c-inner-loop
    runs-on: ubuntu-24.04
    # ★ 这里刻意用**固定值**，不引用 workflow_dispatch 的输入。
    #
    #   原因（实测踩到）：`inputs` 上下文只在 workflow_dispatch 下存在，
    #   而**作业级 timeout-minutes 是在调度期求值的** —— push 触发时该上下文不可用，
    #   整个 run 会在 0 秒直接失败，报「workflow file issue」，
    #   既不产生日志也不产生 job，排查起来毫无线索。
    #   （同一个坑也适用于任何作业级字段：timeout-minutes / runs-on / if 都不要引用 inputs。）
    #
    #   90 分钟 = 手动长跑的最大允许时长（75 分钟）留出构建余量。
    #   "挂起"由 run 步骤里的 shell `timeout` 兜住（见下），不依赖这个值。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libsdl2-dev

      - name: 缓存 LVGL 源码
        uses: actions/cache@v4
        with:
          path: third_party/lvgl
          key: lvgl-v9.2.2-soak

      - name: 拉取 LVGL（锁定版本 v9.2.2）
        run: bash scripts/fetch_lvgl.sh

      - name: 构建（Release，未插桩）
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release -DLVGLCJ_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"

      - name: 长跑（计数收敛断言）
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -euo pipefail
          # ★ 用 `github.event.inputs` 而不是 `inputs`：前者在 push/PR 事件下
          #   渲染为空字符串（配合 || 取默认值），后者在非 dispatch 事件下不存在。
          MINS="${{ github.event.inputs.soak_minutes || '3' }}"
          SECS=$(( MINS * 60 ))
          echo "→ test_soak_asan --seconds ${SECS}（${MINS} 分钟）"
          echo "  判据：每个周期清空后 alive/obj/anim_ctx 必须回到基线，"
          echo "        INVALIDATED 不得超过有界回收上限"
          # ★ 外层再包一个 shell timeout（时长 + 5 分钟余量）：
          #   作业级 timeout-minutes 是固定的安全网，用它兜"挂起"会让一次挂起
          #   白占 90 分钟。这里按**本次实际时长**兜，挂起时几分钟内就明确失败。
          #   -k 保证信号无效时升级为 SIGKILL（arm64 上实测过 SIGTERM 杀不动的情况）。
          timeout -k 15 $(( SECS + 300 )) ./build/bin/test_soak_asan --seconds "${SECS}"

  cross-aarch64:
    name: cross / aarch64（编译检查）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: 缓存 LVGL 源码
        uses: actions/cache@v4
        with:
          path: third_party/lvgl
          key: lvgl-v9.2.2-cross-aarch64

      - name: 拉取 LVGL（锁定版本 v9.2.2）
        run: bash scripts/fetch_lvgl.sh

      - name: 交叉构建（SDL2 关闭：本矩阵不引入 arm64 的 SDL2）
        run: |
          # 这条与 native-ubuntu-arm64 是**互补**关系，不是重复：
          #   · 这里验证「在只有 x86 工具链的机器上也能为 arm64 构建」，
          #     以及编译器层面没有 x86 专属假设（内联汇编、SIMD intrinsic 等）；
          #   · arm64 runner 上则真跑 ctest，验证运行期行为。
          # 两者都保留：交叉构建能在 PR 的每一次提交上快速给出信号。
          cmake -S native -B build-arm64 \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/native/cmake/aarch64-linux-gnu.cmake" \
                -DLVGLCJ_BUILD_SDL2=OFF \
                -DLVGLCJ_BUILD_NULL_BACKEND=ON \
                -DLVGLCJ_BUILD_TESTS=ON
          cmake --build build-arm64 -j

      - name: 确认产物确为 aarch64
        run: |
          file build-arm64/bin/test_leak | grep -q 'ARM aarch64' \
            || { echo "::error::产物不是 aarch64"; file build-arm64/bin/*; exit 1; }

  # ---------------------------------------------------------------------------
  # 仓颉侧：构建 / 单测 / cjlint 零告警 / cjfmt 零 diff / 性能回归护栏
  # 仅在 CANGJIE_SDK_URL 已配置时执行（见文件头说明）
  # ---------------------------------------------------------------------------
  cangjie:
    name: cangjie / ubuntu-x64
    runs-on: ubuntu-24.04
    # ★ 用 vars 里的**开关**判断是否启用，而不是用 URL 本身 —— 因为
    #   URL 必须放进 secrets（见下），而 GitHub 不允许 secrets 出现在 job 级 if: 里。
    #   需要先在本仓库配置： Variables 里加 ENABLE_CANGJIE_JOB=true，
    #                        Secrets 里加 CANGJIE_SDK_URL=<下载地址>
    if: vars.ENABLE_CANGJIE_JOB == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libsdl2-dev

      # ---- 仓颉 SDK（约 385 MB）------------------------------------------
      # ★ 必须缓存：不缓存的话每次 push 都要重下近 400 MB，
      #   而 CI 的时间预算主要会花在这上面，不是花在测试上。
      #   key 刻意**不用 URL**：URL 是机密且是临时签名的，写进 key 既泄露又必然失效。
      #   改用「SDK 版本 + runner」，SDK 升级时改这个版本号即可。
      - name: 缓存仓颉 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/cangjie
          key: cangjie-sdk-linux-x64-1.1.0

      - name: 下载并解包仓颉 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          SDK_URL: ${{ secrets.CANGJIE_SDK_URL }}
        run: |
          set -euo pipefail
          # ★ 链接放在 secrets 里，由 Actions 自动打码。
          #   这类下载地址通常带签名参数（如 objectKey），一旦写进仓库文件就是凭据泄露；
          #   而且它是**有时效**的 —— 过期后只需更新这个 Secret，不必改代码。
          if [ -z "${SDK_URL}" ]; then
            echo "::error::secret CANGJIE_SDK_URL 未配置（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          curl -fL --retry 3 --retry-delay 5 "${SDK_URL}" -o /tmp/cangjie-sdk.tar.gz
          ls -lh /tmp/cangjie-sdk.tar.gz
          mkdir -p "$HOME/cangjie"
          tar -xzf /tmp/cangjie-sdk.tar.gz -C "$HOME/cangjie"

      - name: 定位 SDK 并导出 CANGJIE_HOME
        run: |
          set -euo pipefail
          # ★ 不假设压缩包解开后的目录层级：直接找「哪个目录里有 bin/cjc」。
          #   假设结构会在上游调整打包方式时静默失效；而失败时把实际层级打出来，
          #   能省掉一轮"猜它解到哪了"。
          CJC="$(find "$HOME/cangjie" -maxdepth 5 -type f -name cjc -path '*/bin/*' | head -1)"
          if [ -z "${CJC}" ]; then
            echo "::error::在 ~/cangjie 下找不到 bin/cjc。实际层级："
            find "$HOME/cangjie" -maxdepth 3 -type d | head -20
            exit 1
          fi
          CH="$(dirname "$(dirname "${CJC}")")"
          echo "CANGJIE_HOME=${CH}" >> "$GITHUB_ENV"
          # ★ cjpm 在 tools/bin（不是 bin），两个都要进 PATH
          echo "${CH}/bin" >> "$GITHUB_PATH"
          echo "${CH}/tools/bin" >> "$GITHUB_PATH"
          echo "SDK 位置：${CH}"

      - name: SDK 自检（工具链真的能跑）
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${CANGJIE_HOME}/tools/lib:${CANGJIE_HOME}/runtime/lib/linux_x86_64_cjnative:${LD_LIBRARY_PATH:-}"
          cjc --version
          # cjpm 来自 tools/bin —— 若没进 PATH 会在这里立刻失败，而不是等到后面
          command -v cjpm
          cjpm --version || true

      - name: 缓存 LVGL 源码
        uses: actions/cache@v4
        with:
          path: third_party/lvgl
          key: lvgl-v9.2.2-${{ runner.os }}

      - name: C 层构建（供仓颉侧链接）
        # ★ 必须带 --probes：
        #   src/generated/conf_const.cj 是**生成物且不入库**，它由
        #   scripts/gen_conf_const.py 从 probe_conf 的输出生成，而 probe_conf
        #   只有在 --probes 时才会被构建。不带这个参数，
        #   build_native.sh 会打印「未构建 probe_conf，跳过 conf_const.cj 生成」
        #   然后继续 —— 接着 cjpm build 就会因为缺这个包文件而失败。
        #   （脚本的这条提示是"跳过"而不是"失败"，属于本项目一直在清理的
        #     "静默跳过"模式：这里必须由调用方显式要求，不能靠默认。）
        run: bash scripts/build_native.sh --probes

      - name: 门禁（cjfmt / cjlint / build / test / ctest / ASan）
        run: bash scripts/gate.sh

      - name: 性能采集（WSL/CI 数字仅供参考，不作判定）
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          (cd examples/bench_cj && cjpm build)
          bash scripts/perf.sh --out perf-report.txt || true
          cat perf-report.txt
